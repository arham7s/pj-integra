<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>PJ Integra Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem("pj-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%}

/* Layout: a lab-notebook data room. Sticky section bar, one reading column (~68ch), wide tables in their own scrollers.
   Accent is die-bond copper; posit bit-fields carry their own four hues as the subject's signature detail. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E8ECEF; --ink:#15212C; --muted:#56646F; --line:#D5DCE2;
  --accent:#A9502A; --accent-soft:#F4E3DA;
  --good:#2D7A4E; --good-soft:#E1F0E7; --warn:#9A6400; --warn-soft:#F6ECD6; --bad:#A93838; --bad-soft:#F6E1E1;
  --b-sign:#A93838; --b-reg:#9A6400; --b-exp:#2D6FA3; --b-frac:#2D7A4E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151E26; --sunk:#1B2630; --ink:#E4EAEF; --muted:#94A3AF; --line:#283540;
  --accent:#E3895D; --accent-soft:#3A251B;
  --good:#6CC394; --good-soft:#18301F; --warn:#E0B055; --warn-soft:#33290F; --bad:#EE8080; --bad-soft:#3A1C1C;
  --b-sign:#EE8080; --b-reg:#E0B055; --b-exp:#78B4E6; --b-frac:#6CC394; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151E26; --sunk:#1B2630; --ink:#E4EAEF; --muted:#94A3AF; --line:#283540;
  --accent:#E3895D; --accent-soft:#3A251B;
  --good:#6CC394; --good-soft:#18301F; --warn:#E0B055; --warn-soft:#33290F; --bad:#EE8080; --bad-soft:#3A1C1C;
  --b-sign:#EE8080; --b-reg:#E0B055; --b-exp:#78B4E6; --b-frac:#6CC394; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.1rem);font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.hero,section,.stack,.sec-head,.card,.paper{grid-template-columns:minmax(0,1fr)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto}
.col{max-width:70ch}

/* sticky nav */
.nav{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.nav-bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav-in{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px;scroll-behavior:smooth}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:.84rem;font-weight:500;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:7px;white-space:nowrap;transition:background-color .15s,color .15s,transform .1s}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a:active{transform:scale(.96)}
.nav a.data{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current="page"],.nav a.data[aria-current="page"]{color:var(--surface);background:var(--ink);box-shadow:none}
.theme{flex:none;display:inline-flex;padding:3px;border-radius:9px;background:var(--sunk);border:1px solid var(--line)}
.theme button{font:inherit;font-size:.78rem;font-weight:500;display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--muted);padding:5px 9px;border-radius:6px;cursor:pointer}
.theme button svg{width:14px;height:14px;flex:none}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (max-width:560px){.theme button .lbl{display:none}}
.view{animation:viewIn .28s ease-out}
section.view{border-top:0}
@keyframes viewIn{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view{animation:none}}
.pager{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-block:8px 32px}
.pager a{display:grid;gap:2px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);transition:border-color .15s,transform .1s}
.pager a:hover{border-color:var(--accent)}
.pager a:active{transform:scale(.98)}
.pager a span{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pager a b{font-family:var(--f-display);font-size:1.1rem}
.pager .next{text-align:right;grid-column:2}
.progress{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:10px}

/* hero */
.hero{padding-block:48px 36px;display:grid;gap:28px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700;letter-spacing:-.02em;max-width:18ch}
.hero .lede{font-size:1.15rem;color:var(--muted);max-width:60ch}
.bits{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));gap:2px;max-width:720px}
.bit{aspect-ratio:1/1.5;max-width:100%;border-radius:3px;display:grid;place-items:center;font-family:var(--f-mono);font-size:clamp(.55rem,1.4vw,.8rem);color:var(--surface);font-weight:500}
@media (max-width:560px){.bits{grid-template-columns:repeat(16,minmax(0,1fr))}}
.bit.s{background:var(--b-sign)}.bit.r{background:var(--b-reg)}.bit.e{background:var(--b-exp)}.bit.f{background:var(--b-frac)}
.bitkey{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted);max-width:720px}
.bitkey .note{flex-basis:100%;font-style:normal}
.bitkey span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fact{background:var(--surface);padding:14px 16px;display:grid;gap:2px;align-content:start}
.fact b{font-family:var(--f-display);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums}
.fact small{color:var(--muted);font-size:.82rem;line-height:1.4}

/* sections */
section{padding-block:44px;border-top:1px solid var(--line);display:grid;gap:22px}
.sec-head{display:grid;gap:8px}
.sec-head p{color:var(--muted);max-width:65ch}
.stack{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.card p,.card li{color:var(--ink)}
.card .sub{color:var(--muted);font-size:.9rem}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:6px}
.plain{background:var(--accent-soft);border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.plain .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.read{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 16px;border-radius:0 8px 8px 0;display:grid;gap:6px;font-size:.95rem}
.read .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--warn)}
.read ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.chip{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.g{background:var(--good-soft);color:var(--good)}.chip.w{background:var(--warn-soft);color:var(--warn)}.chip.b{background:var(--bad-soft);color:var(--bad)}.chip.n{background:var(--sunk);color:var(--muted)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.us{background:var(--accent-soft)}

/* papers */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:16px}
.paper-top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:start}
.paper-top .meta{color:var(--muted);font-size:.85rem}
.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:6px 16px;font-size:.93rem}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;min-width:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.open{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem;text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:7px;color:var(--ink);background:var(--surface);white-space:nowrap}
.open:hover{border-color:var(--accent);color:var(--accent)}

/* ruler */
.ruler{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:4px}
.ruler svg{width:100%;height:auto;display:block}
.ruler .cap{font-size:.82rem;color:var(--muted)}

/* timeline */
.tl{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl-row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0 8px 18px;position:relative}
.tl-row::before{content:"";position:absolute;left:-7px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl-row.done::before{background:var(--good);border-color:var(--good)}
.tl-row .when{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
@media (max-width:480px){.tl-row{grid-template-columns:1fr;gap:0}}

/* glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 28px}
.gloss div{padding:10px 0;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:600}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:.93rem}

/* data room */
.files{display:grid;gap:10px}
.file{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.file .ico{width:44px;height:52px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:6px;font-family:var(--f-mono);font-size:.62rem;font-weight:500;color:var(--accent)}
.file .info{min-width:0;display:grid;gap:2px}
.file .name{font-weight:600}
.file .desc{color:var(--muted);font-size:.88rem}
.file .meta{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:560px){.file{grid-template-columns:1fr}.file .ico{display:none}}
.filter{display:flex;flex-wrap:wrap;gap:6px}
.filter button{font:inherit;font-size:.82rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.analogy{background:var(--sunk);border-radius:10px;padding:14px 16px;display:grid;gap:6px;border:1px dashed var(--line)}
.analogy .tag{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--b-exp)}
.open.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.open.primary:hover{color:var(--surface);opacity:.9}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.step-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--accent-soft);color:var(--accent)}
@media (max-width:480px){.step{grid-template-columns:1fr;gap:10px}}
.uc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.uc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.uc-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.uc-dl{margin:0;display:grid;gap:8px;font-size:.93rem}
.uc-dl dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.uc-dl dd{margin:0}
.formula{font-family:var(--f-mono);background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:.9rem}
.dec{display:grid;gap:8px}
.dec-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.dec-lbl{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.dec-bits{max-width:none}
@media (max-width:560px){.dec-row{grid-template-columns:1fr;gap:4px}.dec-bits{grid-template-columns:repeat(16,minmax(0,1fr))}}
.dec-note{font-size:.93rem}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.arch-col{display:grid;gap:6px;align-content:start;grid-template-columns:minmax(0,1fr);min-width:0}
.arch-cap{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.blk{border-radius:8px;padding:10px 12px;font-size:.88rem;font-weight:500;border:1px solid var(--line);display:grid;gap:8px;grid-template-columns:minmax(0,1fr);min-width:0}
.blk.host{background:var(--sunk)}
.blk.fpga{background:var(--warn-soft);border-color:transparent}
.blk.silicon{background:var(--accent-soft);border-color:transparent}
.blk-note{font-size:.8rem;font-weight:400;color:var(--muted)}
.wire{justify-self:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border-left:2px dashed var(--line);padding:2px 0 2px 8px}
.cores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.cores span{background:var(--surface);border-radius:4px;font-family:var(--f-mono);font-size:.62rem;padding:4px 2px;text-align:center;color:var(--accent)}
.cores.many{grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.cores.many span{height:12px;padding:0;font-size:0;min-width:0}
.src{font-size:.78rem;color:var(--muted);font-style:italic}
tr.hl td{background:var(--accent-soft)}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:22px 26px;counter-reset:f}
.fstep{position:relative;border-radius:10px;padding:12px 12px 12px 14px;display:grid;gap:3px;align-content:start;border:1px solid var(--line);background:var(--surface);min-width:0}
.fstep b{font-family:var(--f-display);font-size:1rem}
.fstep span{font-size:.85rem}
.fstep em{font-style:normal;font-size:.76rem;color:var(--muted);font-family:var(--f-mono)}
.fstep .fnum{position:absolute;top:-10px;left:10px;font-family:var(--f-mono);font-size:.7rem;background:var(--ink);color:var(--surface);border-radius:999px;padding:1px 8px}
.fstep::after{content:"→";position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.fstep:last-child::after{content:none}
.fstep.own{background:var(--accent-soft);border-color:var(--accent)}
.fstep.user{background:var(--good-soft);border-color:transparent}
.fstep.ext{background:var(--sunk)}
@media (max-width:560px){.fstep::after{content:"↓";right:auto;left:50%;top:auto;bottom:-20px;transform:translateX(-50%)}}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.4em;gap:10px;align-items:center;font-size:.86rem}
.hb .lab{min-width:0}
.hb .track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hb .fill{display:block;height:100%;background:var(--b-exp);border-radius:4px}
.hb.me .fill{background:var(--accent)}
.hb .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.vbars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.vb{flex:1;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;height:100%;gap:4px;min-width:0}
.vb .v{font-family:var(--f-mono);font-size:.8rem}
.vb .col{width:min(56px,100%);align-self:end;background:var(--b-exp);border-radius:5px 5px 0 0}
.vb.me .col{background:var(--accent)}
.vb .l{font-size:.78rem;color:var(--muted);text-align:center;padding-top:4px;transform:translateY(100%);margin-bottom:-4px}
.vbars + .src{margin-top:28px}
.stat{display:grid;gap:2px;background:var(--sunk);border-radius:10px;padding:14px}
.stat b{font-family:var(--f-display);font-size:1.6rem}
.stat span{font-size:.86rem;color:var(--muted)}
.funnel{display:grid;gap:6px;justify-items:center}
.fn{display:grid;gap:1px;text-align:center;padding:10px 14px;border-radius:8px;color:var(--ink);max-width:100%}
.fn span{font-size:.82rem;color:var(--muted)}
.fn.l1{width:100%;background:var(--sunk)}.fn.l2{width:88%;background:var(--sunk)}.fn.l3{width:74%;background:var(--warn-soft)}.fn.l4{width:60%;background:var(--accent-soft)}.fn.l5{width:46%;background:var(--accent);}
.fn.l5 b,.fn.l5 span{color:var(--surface)}
@media (max-width:560px){.fn.l2,.fn.l3,.fn.l4,.fn.l5{width:100%}}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.side{border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start}
.car-side{background:var(--sunk)}.lab-side{background:var(--accent-soft)}
.carsvg,.labsvg{width:100%;height:auto;display:block}
.car-body{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.wheel{fill:var(--ink)}
.zone{stroke:none}.z1{fill:var(--b-frac)}.z2{fill:var(--b-sign)}.z3{fill:var(--b-exp)}.z4{fill:var(--b-reg)}.z5{fill:var(--muted)}
.zt{font-family:var(--f-body);font-size:9.5px;text-anchor:middle;fill:var(--surface);font-weight:600}
.zt.dark{fill:var(--surface)}.zt.muted{fill:var(--muted);font-weight:500;font-size:11px}
.rack{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.srv{fill:var(--sunk);stroke:var(--line)}
.srv.hi{fill:var(--accent)}
.calc{display:grid;gap:6px;max-width:520px}
.calc input[type=range]{width:100%;accent-color:var(--accent)}
.own{display:grid;gap:8px}
.own-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.own-old{background:var(--b-exp);transition:width .2s}.own-new{background:var(--accent);transition:width .2s}
.own-key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem}
.own-key .k-old::before,.own-key .k-new::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.own-key .k-old::before{background:var(--b-exp)}.own-key .k-new::before{background:var(--accent)}
.srcs{font-size:.88rem}
.vc-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.84rem;color:var(--muted)}
.vc-legend .vc-tag:nth-child(2){margin-left:14px}
.vc{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr) 28px minmax(0,1fr);align-items:stretch}
.vc-phase{display:grid;gap:8px;align-content:start;background:var(--sunk);border-radius:12px;padding:12px;min-width:0}
.vc-head{display:flex;gap:10px;align-items:flex-start;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.vc-head b{display:block;font-family:var(--f-display);font-size:1.02rem}
.vc-head span{font-size:.78rem;color:var(--muted);line-height:1.35}
.vc-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:.78rem}
.vc-item{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:grid;gap:3px;min-width:0}
.vc-item.own{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.vc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.vc-top b{font-size:.92rem}
.vc-item > span{font-size:.82rem;line-height:1.4}
.vc-item em{font-style:normal;font-size:.74rem;color:var(--muted)}
.vc-tag{flex:none;font-size:.64rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.vc-tag.own{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.vc-arrow{display:grid;place-items:center;color:var(--muted);font-size:1.1rem}
.vc-sum{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.92rem}
@media (max-width:900px){.vc{grid-template-columns:minmax(0,1fr)}.vc-arrow{height:26px}.vc-arrow span{transform:rotate(90deg)}}
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:12px;position:relative}
.stepper::before{content:"";position:absolute;left:8%;right:8%;top:17px;height:2px;background:var(--line)}
.stepper li{position:relative;display:grid;gap:4px;justify-items:center;text-align:center;align-content:start;padding:0 4px}
.stepper .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--f-mono);font-size:.85rem;position:relative;z-index:1;margin-bottom:6px}
.stepper b{font-size:.92rem}
.stepper li > span:not(.dot):not(.here){font-size:.8rem;line-height:1.4}
.stepper em{font-style:normal;font-size:.72rem;color:var(--muted)}
.stepper li.me .dot{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stepper li.me{background:var(--accent-soft);border-radius:10px;padding:0 6px 10px}
.stepper .here{margin-top:4px;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--surface);background:var(--accent);border-radius:999px;padding:2px 8px}
@media (max-width:760px){.stepper{grid-template-columns:minmax(0,1fr);gap:0}.stepper::before{left:17px;right:auto;top:18px;bottom:18px;width:2px;height:auto}
.stepper li{grid-template-columns:36px minmax(0,1fr);justify-items:start;text-align:left;column-gap:12px;padding:6px 0}
.stepper li > *:not(.dot){grid-column:2}.stepper .dot{grid-row:1 / span 4;margin:0}.stepper li.me{padding:6px 8px 10px 0}}
.ucd-list{display:grid;gap:12px}
.ucd{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ucd[open]{border-color:var(--accent)}
.ucd summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:16px 18px}
.ucd summary::-webkit-details-marker{display:none}
.ucd summary:hover{background:var(--sunk)}
.ucd summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ucd-sum{flex:1;min-width:0;display:grid;gap:3px}
.ucd-title{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ucd-title b{font-family:var(--f-display);font-size:1.15rem}
.ucd-line{color:var(--muted);font-size:.9rem}
.ucd-chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;transition:transform .2s}
.ucd-chev::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-2px) rotate(45deg)}
.ucd[open] .ucd-chev{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){.ucd-chev{transition:none}}
.ucd-body{padding:4px 18px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--line)}
.ucd-body > .grid2{margin:0}
.uc-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.uc-block{display:grid;gap:10px;align-content:start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.uc-block h4{margin:0;font-family:var(--f-display);font-size:1rem}
.uc-tools{display:flex;gap:8px;flex-wrap:wrap}
.uc-tools button{font:inherit;cursor:pointer}
.ill{width:100%;height:auto;display:block;max-width:520px}
.ill-a{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.ill-t{font-family:var(--f-body);font-size:12px;text-anchor:middle;fill:var(--ink);font-weight:600}
.ill-t.s{font-size:10.5px;font-weight:500;fill:var(--muted)}
.ill-t.light{fill:var(--surface)}
.ill-mol polygon,.ill-mol circle{fill:var(--b-exp);stroke:var(--b-exp)}
.ill-mol line{stroke:var(--b-exp);stroke-width:2}
.ill-arrow{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.ill-ah{fill:var(--muted)}
.ill-dots circle{fill:var(--b-exp);opacity:.35}
.ill-flow path{fill:none;stroke:var(--b-exp);stroke-width:1.5;opacity:.6}
.ill-cool{fill:var(--sunk)}
.ill-frame{fill:none;stroke:var(--line);stroke-width:1.5}
.ill-joint{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4}
.sdot{fill:var(--accent);opacity:.85}
.saxis{stroke:var(--muted);stroke-width:1}
footer{padding-block:32px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}

.gate{min-height:80vh;display:grid;place-items:center;padding-block:40px}
.gate form{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
.gate h1{font-size:1.7rem}
.gate p{color:var(--muted);font-size:.93rem}
.gate label{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.gate input{font:inherit;font-family:var(--f-mono);padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.gate input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gate button{font:inherit;font-weight:600;padding:11px 14px;border-radius:8px;border:0;background:var(--ink);color:var(--surface);cursor:pointer}
.gate button[disabled]{opacity:.6;cursor:progress}
.gate .err{color:var(--bad);font-size:.88rem;min-height:1.2em}
.lockchip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pdfv{position:fixed;inset:0;z-index:30;background:rgba(8,12,16,.6);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.pdfv-box{width:min(1100px,100%);height:100%;max-height:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.pdfv-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.pdfv-bar b{font-family:var(--f-display);min-width:0}
.pdfv-acts{display:flex;flex-wrap:wrap;gap:6px}
.pdfv-acts button.open{font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.pdfv iframe{width:100%;height:100%;border:0;background:var(--sunk)}
.pdfv-msg{display:grid;place-items:center;color:var(--muted);padding:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:.88rem;z-index:20}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <span class="lockchip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private briefing</span>
    <h1>PJ Integra</h1>
    <p>This briefing and its source files are encrypted. Enter the passphrase to unlock them in your browser.</p>
    <label for="pass">Passphrase</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button type="submit" id="unlockBtn">Unlock</button>
    <span class="err" id="err" role="alert"></span>
  </form>
</div>
<script>
(function(){
  var SALT = Uint8Array.from(atob("2Oxp9T1BYS8t41ML7NTySg=="), function(c){return c.charCodeAt(0);}), ITER = 600000;
  var KEY = null, te = new TextEncoder();
  function b64(buf){ var s="",b=new Uint8Array(buf); for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s){ return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0);}); }
  async function derive(pass){
    var base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:SALT, iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  }
  async function decrypt(url){
    var r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("fetch " + r.status);
    var b = new Uint8Array(await r.arrayBuffer());
    return crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, KEY, b.slice(12));
  }
  function toast(msg){ var t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; t.hidden=!msg; }
  async function open(){
    var data = JSON.parse(new TextDecoder().decode(await decrypt("content.bin")));
    document.getElementById("gate").remove();
    document.body.insertAdjacentHTML("afterbegin", data.html);
    var s = document.createElement("script"); s.textContent = data.js; document.body.appendChild(s);
    var cache = {};
    document.addEventListener("click", async function(e){
      var a = e.target.closest && e.target.closest('a[href^="files/"]'); if(!a) return;
      e.preventDefault();
      var href = a.getAttribute("href"), name = href.split("/").pop();
      var card = a.closest(".file,.paper"), title = card && card.querySelector(".name,h3") ? card.querySelector(".name,h3").textContent : name;
      viewer(title, name, null);
      try{
        if(!cache[href]) cache[href] = URL.createObjectURL(new Blob([await decrypt(href + ".enc")], {type:"application/pdf"}));
        viewer(title, name, cache[href]);
      }catch(err){ viewer(title, name, "error"); }
    });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeViewer(); });
  }
  var lastFocus = null;
  function closeViewer(){ var v=document.getElementById("pdfv"); if(v){ v.remove(); document.body.style.overflow=""; if(lastFocus) lastFocus.focus(); } }
  function viewer(title, name, url){
    var v = document.getElementById("pdfv");
    if(!v){ lastFocus=document.activeElement; v=document.createElement("div"); v.id="pdfv"; v.className="pdfv"; v.setAttribute("role","dialog"); v.setAttribute("aria-modal","true"); v.setAttribute("aria-label",title); document.body.appendChild(v); document.body.style.overflow="hidden";
      v.addEventListener("click", function(e){ if(e.target===v || e.target.closest("[data-close]")) closeViewer(); }); }
    var body;
    if(url===null) body = '<div class="pdfv-msg">Decrypting ' + name + '…</div>';
    else if(url==="error") body = '<div class="pdfv-msg">This file couldn\'t be decrypted. Reload the page and try again.</div>';
    else body = '<iframe src="'+url+'" title="'+title.replace(/"/g,"&quot;")+'"></iframe>';
    var acts = (url && url!=="error") ? '<a class="open" href="'+url+'" target="_blank" rel="noopener">Open in new tab ↗</a><a class="open" href="'+url+'" download="'+name+'">Download</a>' : '';
    v.innerHTML = '<div class="pdfv-box"><div class="pdfv-bar"><b>'+title+'</b><div class="pdfv-acts">'+acts+'<button type="button" class="open" data-close>Close</button></div></div>'+body+'</div>';
    var c=v.querySelector("[data-close]"); if(c) c.focus();
  }
  async function tryKey(){
    try{ await open(); return true; }catch(e){ return false; }
  }
  (async function(){
    if (!window.crypto || !crypto.subtle){ document.getElementById("err").textContent = "This browser can't decrypt the page. Open it over https in a current browser."; return; }
    try{ var saved = sessionStorage.getItem("pj-key"); if(saved){ KEY = await crypto.subtle.importKey("raw", unb64(saved), "AES-GCM", false, ["decrypt"]); if(await tryKey()) return; sessionStorage.removeItem("pj-key"); } }catch(e){}
    document.getElementById("pass").focus();
  })();
  document.getElementById("gateForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var btn=document.getElementById("unlockBtn"), err=document.getElementById("err");
    btn.disabled=true; btn.textContent="Unlocking…"; err.textContent="";
    try{
      var k = await derive(document.getElementById("pass").value);
      KEY = k;
      if (await tryKey()){ try{ sessionStorage.setItem("pj-key", b64(await crypto.subtle.exportKey("raw", k))); }catch(_){} return; }
      err.textContent = "That passphrase didn't work. Check it and try again.";
    }catch(x){ err.textContent = "Something went wrong while unlocking. Reload and try again."; }
    btn.disabled=false; btn.textContent="Unlock";
  });
})();
</script>
</body>
</html>
